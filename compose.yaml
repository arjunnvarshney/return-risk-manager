name: return-risk-manager

x-runtime: &runtime
  build:
    context: .
    dockerfile: Dockerfile
  image: return-risk-manager:local
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m
    - /home/app/.cache:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  environment:
    RETURN_RISK_DB_PATH: /runtime/shadow.db
  volumes:
    - shadow-monitoring-data:/runtime

services:
  api:
    <<: *runtime
    command:
      - python
      - -m
      - uvicorn
      - return_risk.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    <<: *runtime
    command:
      - python
      - -m
      - streamlit
      - run
      - demo/app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
      - --server.headless
      - "true"
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  shadow-monitoring-data:

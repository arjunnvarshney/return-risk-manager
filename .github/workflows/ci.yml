name: Submission preflight

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and verification dependencies
        run: python -m pip install -e ".[modeling,api,demo,dev]"

      - name: Verify immutable release and test suite
        run: python scripts/preflight.py
